# Issue #19 [P3-2] — Unbound as the baseline recursive resolver for the testbed.
#
# With only our root hint and no forwarders/DNSSEC, Unbound performs genuine iterative
# recursion root -> TLD -> authoritative over the #18 NSD hierarchy. This is real and works
# even though the rpos resolver nodes are idle scaffolds (their cross-container transport is
# a deferred issue).
#
# !!! DO NOT ADD any `private-address:` line !!!
# Every synthetic answer in this testbed is in 10.0.0.0/8 (see zones/MANIFEST.json). Unbound
# STRIPS RRsets whose addresses match a configured private-address, which would turn every
# answer into an empty NOERROR. The compiled default has none; many distro example configs
# add `private-address: 10.0.0.0/8` — we deliberately omit it.
server:
    interface: 0.0.0.0
    port: 53
    do-ip6: no

    # Closed local testbed: allow all clients (matches the #18 NSD servers, which run open).
    # This also covers queries arriving via Docker Desktop's host port-proxy, whose source
    # address inside the VM is not a fixed testbed IP. The published port is bound to loopback
    # in docker-compose.yml, so host exposure is limited to this machine.
    access-control: 0.0.0.0/0 allow

    # our containerized root is the sole entry point
    root-hints: "/etc/unbound/root.hints"

    # the auth servers live on RFC1918 space (172.28/24); allow querying them
    do-not-query-localhost: no

    # synthetic zones are unsigned; keep recursion simple and observable for the thesis
    harden-dnssec-stripped: no
    qname-minimisation: no

    # log to stderr so `docker logs unbound` shows recursion
    logfile: ""
    use-syslog: no
    verbosity: 2
    chroot: ""
    username: ""
