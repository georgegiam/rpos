# dns-auth1 — authoritative for its share of the domains (one zone per domain).
# The per-domain zone: stanzas are machine-generated by generate_zones.py into
# zones/zones.auth1.conf and pulled in here — no hand-written boilerplate.
server:
	ip-address: 0.0.0.0
	port: 53
	server-count: 1
	zonesdir: "/zones"
	database: ""
	username: ""
	chroot: ""
	pidfile: ""
	verbosity: 2
	do-ip6: no

include: "/zones/zones.auth1.conf"
