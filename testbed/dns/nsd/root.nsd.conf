# dns-root — authoritative for the root zone (.). Delegates com./org. to the TLD servers.
server:
	ip-address: 0.0.0.0
	port: 53
	server-count: 1
	zonesdir: "/zones"
	database: ""      # no db: serve zone files directly (read-only testbed)
	username: ""      # container runs as root; no privilege drop
	chroot: ""
	pidfile: ""
	verbosity: 2
	do-ip6: no

zone:
	name: "."
	zonefile: "root/root.zone"
