# dns-auth2 — authoritative for its share of the domains (one zone per domain).
# Per-domain zone: stanzas are machine-generated into zones/zones.auth2.conf.
server:
	ip-address: 0.0.0.0
	port: 53
	server-count: 1
	zonesdir: "/zones"
	database: ""
	username: ""
	chroot: ""
	pidfile: ""
	verbosity: 2
	do-ip6: no

include: "/zones/zones.auth2.conf"
